    title: "把常量时间测出来"
    fig_num: "图 3.2"
    intro: "这张图把已发布测量值与当前策略放在一起：观测值来自一轮明确的运行，门槛与哨兵值是执行策略，不是证明。"
    axis_label: "|τ|（时序泄漏统计量）"
    gate_label: "PR 门禁 |τ| < 0.20"
    control_label: "negative_control——必须在这里故意失败（证明检测器不是瞎的）"
    landscape_heading: "门禁全景"
    cluster_label: "公开的 ct_*——都在 0.20 以下"
    leak_heading: "它抓到的那次泄漏"
    leak_label: "crypto-bigint 0.6 → 0.7.3：一次真实的域求逆泄漏，被抓到并修掉"
    context: "v1.2.0 测量快照时共 19 条真实路径（到 v1.11.0 为 20 条），其中 4 条带公开数值；ct_sign 仍在 0.20 门禁内，另外三条后来转到更宽松的 0.55 nightly 哨兵值。"
