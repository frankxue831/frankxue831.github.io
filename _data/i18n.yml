# Internationalization strings.
# Page front matter sets `lang: en` or `lang: zh`; includes pull
# the matching block.
#
# --- ZH terminology of record (claims-parity rule, 2026-08 audit) ----------
# One EN term → one ZH rendering, applied across zh/, _notes/*.zh.md, and
# this file. Use these when translating new copy; add a row when a term
# starts recurring.
#   secret-touching path    → 涉密路径
#   key schedule (SM4)      → 密钥扩展
#   key schedule (TLCP PRF) → 密钥派生（key schedule）
#   harness                 → harness（不译；不得并入「门禁」）
#   gate (dudect)           → 门禁
#   citation gate           → 引用校验门（简称：校验门）
#   sentinel                → 哨兵值（可加限定语：粗回归哨兵值）
#   class-split noise       → 类分割噪声
#   leak                    → 泄漏（不用「泄露」）
#   typed findings          → 类型化 findings
#   always-on surface       → 常开接口
#   At a glance (aria)      → 一览
#   fleet management        → 机群管理
#   review (human)          → 复核（人工复核；不留英文 review）
#   diagram canvas          → 图示画布（首次可加括注 diagram canvas）
#   validation (PKIX path)  → 路径构建 / 信任判定（不与「验证」互换）
#   verification (signature)→ 签名验证
#   one-shot (CLI)          → 单次运行（不用「一次性」）
#   MCP server              → MCP 服务端
#   Private/local (status)  → 私有、本地（不用斜杠）
#   no-confirmation (KX)    → 免密钥确认（不得缩成「免确认」）
#   FFI entry points        → 入口（不用「入口点」）
#   decaying (memory)       → 会衰减（不用「会过期」）
#   failure modes           → 失败模式
#   Not published. (marker) → 未单独发版（不用「未发布」；≠ 不单独发版 叙述句）
#   Unpublished (grid dt)   → 版本缺口
#   census (fuzz targets)   → 模糊测试 census（计数器；不另造「模糊目标数」）
#   backlog (parked work)   → 待办（backlog）
#   AI coding agent         → AI 编程 Agent（首次可括注；不混用裸「编程 Agent」）
#   untrusted input         → 不可信输入（不用「不受信」）
#   freeze (public API)     → 冻结（不用「冻住」）
#   k-class (signatures)    → k-class（与 EN 一致；不写「k 类」）
#   invert diagnostics      → 域求逆诊断（不用 bare invert 诊断）
#   render (video verb)     → 渲染（默认完整；不省作「渲」）
#   cold start              → 冷启动
#   wire output             → 协议输出（wire）（不用单独的「线上输出」）
#   overclaim               → 夸大 / 说满（极性勿与「含糊」互换）
#   load-bearing            → 最吃紧 / 最关键（不用「承重」calque）
#   private/local (body)    → 私有、本地（顿号；与 status 一致）
#   guarded (control)       → 受控（不用「受约束」作同一概念）
# Voice rule: ZH keeps its native register and may add explanatory glosses;
# disclosures, hedges, numbers, and limitations must match EN exactly.
# ---------------------------------------------------------------------------

en:
  html_lang: "en"
  tagline: "Software engineer, mostly in Rust. I publish selected work with its status, evidence, and limits visible."
  # Short suffix for the <title> element on the home page, where page title ==
  # site title. head.html builds the document title so the suffix follows the
  # page locale; jekyll-seo-tag can only read the single global site.tagline.
  short_tagline: "Software engineer, mostly in Rust"
  # Shared more-link for work-list project rows (home + projects index). Note
  # rows keep their own, shorter `notes.read_more` in English.
  list:
    read_more: "Read more →"
  nav:
    home: "Index"
    about: "About"
    work: "Work"
    contact: "Contact"
    writing: "Notes"
    primary_aria: "Primary"
    menu: "Menu"
    skip: "Skip to content"
  switcher:
    label: "中文"
    aria: "Switch to Chinese"
  footer:
    elsewhere: "Elsewhere"
    colophon: "Colophon"
    # Landmark label used only when a page renders one footer per locale (the
    # shared 404): distinguishes the two contentinfo landmarks at the JS-off
    # baseline. Each locale names itself in its own language.
    locale_label: "English"
    set_in: "Set in"
    built_with: "Built with Jekyll. Hosted on GitHub Pages."
    colophon_more: "How it's built"
    last_built: "Last built"
  project_summary:
    aria: "Project summary"
    role: "Role"
    status: "Status"
    stack: "Stack"
    release: "Release"
    snapshot: "Snapshot"
    links: "Links"
    source: "Source"
    owner: "Personal project"
    key_outcome: "Key outcome"
  theme:
    label: "Theme"
    auto: "Auto"
    light: "Light"
    dark: "Dark"
    # {current}, {effective}, and {next} are substituted by theme.js on load. The whole
    # sentence is localized so each language owns its own punctuation +
    # word order. Server-rendered aria-label uses `label` as a generic
    # fallback for the brief window before theme.js runs.
    aria_template: "Theme preference: {current}. Current appearance: {effective}. Switch to {next}."
  toc:
    # Contents rail on project detail pages. Built by contents.js from the
    # page's <h2> headings; this label is the rail heading + nav aria-label.
    label: "On this page"
  install:
    # Copy-to-clipboard install command on the gm-crypto-rs detail page.
    label: "Install"
    copy: "Copy"
    copied: "Copied"
    aria: "Copy install command"
    copied_aria: "Install command copied"
    manual: "Copy manually"
    manual_aria: "Command selected. Copy manually."
  notes:
    # Writing/Notes section.
    all: "All notes"
    read_more: "Read →"
    none: "Nothing published yet."
  dudect:
    title: "Constant-time, measured"
    fig_num: "fig. 3.2"
    intro: "Published measurements and current policy share one view: observed values are evidence from a named run, while the gate and sentinel are enforcement thresholds rather than proof."
    axis_label: "|τ| (timing-leak statistic)"
    gate_label: "PR gate |τ| < 0.20"
    control_label: "negative_control — must fire here (proof the detector isn't blind)"
    landscape_heading: "The gate landscape"
    cluster_label: "published ct_* — all under 0.20"
    leak_heading: "The leak it caught"
    leak_label: "crypto-bigint 0.6 → 0.7.3: a real invert leak, caught and fixed"
    context: "4 of 19 real targets at the v1.2.0 measurement snapshot (20 as of v1.11.0), shown with published values; ct_sign still gates under 0.20, the other three later moved to the looser 0.55 nightly sentinel."
    caveat: "dudect reports detection events — a low |τ| means no leak was detected under the budget given, not that none exists."
    provenance: "Measured: v0.2 W0 harness, 100K samples (pre-2026-05-12 runner). The k-class sign and the two invert diagnostics later moved to telemetry + a |τ| ≥ 0.55 sentinel."
    source: "Source: gm-crypto-rs SECURITY.md @ v1.2.0"
    table_caption: "Published dudect measurements (gm-crypto-rs, measured at v1.2.0; unchanged since)"
    table_scroll_label: "Constant-time measurement table; scroll horizontally when needed"
    col_target: "Target"
    col_measures: "What it measures"
    col_tau: "|τ|"
    col_gate: "Gate"
    col_status: "Status"
    status_pass: "under gate"
    status_sentinel: "under sentinel"
    status_fire: "must fire"
    status_caught: "Over gate — caught"
    policy_sentinel_label: "nightly sentinel"
    leak_before_row: "before (crypto-bigint 0.6)"
    leak_after_row: "after (0.7.3 upgrade)"

  glossary:
    "constant-time":
      label: "constant-time"
      def: "Code whose running time does not depend on secret values, so an attacker can't recover secrets by measuring how long it takes. It's a design target, not a guarantee — some hardware can still leak."
    "storyboard":
      label: "storyboard"
      def: "A declarative script for a video: an ordered list of beats — plots, cited code callouts, concept diagrams — each with narration text. It is the engine's only input; nothing it doesn't specify appears on screen."
    "manim":
      label: "Manim"
      def: "A programmatic animation library for mathematical and technical video. Scenes are code, not timeline edits — which is what lets a generator emit them deterministically."
    "sm2":
      label: "SM2"
      def: "A Chinese national public-key standard (GB/T 32918) built on elliptic curves — used for digital signatures, key exchange, and public-key encryption."
    "sm3":
      label: "SM3"
      def: "A Chinese national cryptographic hash standard (GB/T 32905) producing a 256-bit digest — broadly the SM-family counterpart to SHA-256."
    "sm4":
      label: "SM4"
      def: "A Chinese national block cipher standard (GB/T 32907) with a 128-bit block and 128-bit key, used for bulk symmetric encryption."
    "no_std":
      label: "no_std"
      def: "A Rust build that doesn't link the standard library, so the code can run in constrained environments — embedded targets, kernels, WebAssembly. It has only `core`; heap allocation is opt-in, requiring `alloc` and an explicit allocator."
    "dudect":
      label: "dudect"
      def: "A statistical test for timing leaks: it times an operation over two input classes and checks whether their timing distributions differ. It detects leaks under a measurement budget — it can't prove none exist."
    "mcp":
      label: "MCP"
      def: "Model Context Protocol — an open protocol that lets an AI agent discover and call external tools through one uniform interface, instead of bespoke per-tool glue."
    "rag":
      label: "RAG"
      def: "Retrieval-Augmented Generation — pulling relevant text from a store and feeding it to the model at query time. The plain version tracks no staleness or trust, so rolled-back facts can resurface."
    "grounding":
      label: "grounded"
      def: "Checking a remembered fact against the current code state, so knowledge that no longer holds can be flagged or dropped instead of trusted blindly."
    "launchd":
      label: "launchd"
      def: "macOS's system service manager — it starts, stops, and supervises background services (roughly the macOS counterpart to Linux's systemd)."
    "self-hosted-runner":
      label: "self-hosted runner"
      def: "A machine you run yourself to execute GitHub Actions jobs, instead of GitHub's cloud runners — you own the OS, the network, and what persists between jobs."
    "daemon":
      label: "daemon"
      def: "A program that stays resident in the background between jobs. ghrunners is deliberately the opposite — one-shot: it runs, acts, and exits, holding no long-lived state."
  details:
    earlier_releases: "Earlier releases (v0.6.0 – v0.13.0)"
