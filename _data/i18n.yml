    table_caption: "公开的 dudect 测量值（gm-crypto-rs，测于 v1.2.0；此后未变）"
    table_scroll_label: "常量时间测量表；空间不足时可横向滚动"
    col_target: "目标"
    col_measures: "测的是什么"
    col_tau: "|τ|"
    col_gate: "门禁"
    col_status: "状态"
    status_pass: "在门禁内"
    status_sentinel: "在哨兵值内"
    status_fire: "必须故意失败"
    status_caught: "超过门槛——已捕获"
    policy_sentinel_label: "nightly 哨兵"
    leak_before_row: "修复前（crypto-bigint 0.6）"
    leak_after_row: "修复后（升级到 0.7.3）"
  glossary:
    "constant-time":
      label: "常量时间"
      def: "运行耗时不随密钥等秘密值变化的代码，这样攻击者就无法靠测量耗时来还原秘密。它是一个设计目标，而非保证——某些硬件仍可能泄漏。"
    "storyboard":
      label: "storyboard"
      def: "视频的声明式脚本：一列有序的 beat——图示、带引用的代码标注、概念图——每个都配旁白文本。它是引擎唯一的输入；它没写的东西不会出现在画面上。"
    "manim":
      label: "Manim"
      def: "用代码生成数学、技术类动画的库。场景是代码而不是时间线剪辑——正因如此，生成器才能确定性地产出这些场景。"
    "sm2":
      label: "SM2"
      def: "中国商用密码公钥标准（GB/T 32918），基于椭圆曲线，用于数字签名、密钥交换和公钥加密。"
    "sm3":
      label: "SM3"
      def: "中国商用密码杂凑（哈希）标准（GB/T 32905），输出 256 位摘要，在国密体系中大致对应 SHA-256 的角色。"
    "sm4":
      label: "SM4"
      def: "中国商用密码分组密码标准（GB/T 32907），分组长 128 位、密钥长 128 位，用于批量对称加密。"
    "no_std":
      label: "no_std"
      def: "不链接标准库的 Rust 构建，代码因而能运行在嵌入式、内核、WebAssembly 等受限环境中。它只能使用 core（标准库的子集）；需要堆分配时才显式引入 alloc 并提供分配器。"
    "dudect":
      label: "dudect"
      def: "一种检测时序泄漏的统计方法：对两类输入分别计时，看两组耗时分布是否有差异。它在给定的测量预算下检测泄漏，但无法证明泄漏不存在。"
    "mcp":
      label: "MCP"
      def: "Model Context Protocol（模型上下文协议）——一套开放协议，让 AI Agent 通过统一接口发现并调用外部工具，而不必为每个工具单独写胶水代码。"
    "rag":
      label: "RAG"
      def: "Retrieval-Augmented Generation（检索增强生成）——在查询时从存储里取出相关片段，喂给模型。最朴素的做法不记录新鲜度和可信度，已经回滚掉的旧事实可能又冒出来。"
    "grounding":
      label: "对上代码"
      def: "把记下来的事实拿去和当前代码状态核对，让不再成立的旧知识能被标记或丢弃，而不是被盲目采信。"
    "launchd":
      label: "launchd"
      def: "macOS 的系统服务管理器——负责启动、停止、监督后台服务（大致相当于 Linux 上的 systemd）。"
    "self-hosted-runner":
      label: "self-hosted runner"
      def: "你自己运行、用来执行 GitHub Actions 任务的机器，区别于 GitHub 托管的云端 runner——操作系统、网络，以及任务之间保留什么，都由你掌控。"
    "daemon":
      label: "守护进程"
      def: "在任务之间常驻后台的程序。ghrunners 刻意反其道而行——单次运行：跑一次、做完动作就退出，不保留长期状态。"
  details:
    earlier_releases: "更早的版本（v0.6.0 – v0.13.0）"
