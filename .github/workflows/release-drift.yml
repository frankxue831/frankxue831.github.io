name: Release drift

# Does any public_tag project's _data/projects.yml release trail the version
# actually published on crates.io? It reaches the registry, so it lives outside
# the hermetic validate_site.rb.
#
# Two postures. On pull_request / push it is warn-only: an unrelated PR must
# never go red because the registry moved ahead, so drift surfaces only as a
# ::warning:: annotation + job summary. On the weekly cron and manual runs it is
# STRICT and fails the run — a warning on a green check is invisible, which is
# how the site sat at v1.6.0 for six weeks after gmcrypto-core shipped 1.9.0
# (and at v0.16.0 after 1.0.0 before that). A red scheduled run notifies; it
# blocks nothing.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "3.3" # script is pure stdlib — no bundler needed

      - name: Check release drift vs crates.io
        env:
          # Strict only where a failure is a notification rather than a blocker.
          DRIFT_STRICT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: ruby scripts/check_release_drift.rb
