title: Frank Xue
tagline: Software engineer.
author:
  name: Frank Xue
# Email intentionally omitted from public site for now.
# When re-enabling, restore `email:` and `author.email:` below;
# the footer link, hero meta, contact form action, and any
# `mailto:` hrefs in the page templates will pick it up.
description: >-
  Personal site of Frank Xue — software engineer. Notes and selected work.
baseurl: ""
url: "https://www.frankxue.dev"
lang: en

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Writing/Notes live in a collection (not _posts) so each note declares its own
# lang + alternate + permalink, mirroring the bilingual page pattern.
collections:
  notes:
    output: true

# Atom feed. jekyll-feed's main feed is _posts-only (and there are none, so it
# was empty). Move that empty posts feed aside and let the notes collection
# feed claim /feed.xml — head.html already links /feed.xml. One combined feed,
# both languages. posts_limit lifts jekyll-feed's default 10-entry cap, which
# silently dropped the oldest EN+ZH note pair once the corpus hit 12 documents.
feed:
  path: feed/posts.xml
  posts_limit: 50
  collections:
    notes:
      path: feed.xml

github_username: frankxue831
# linkedin_username:
# twitter_username:

defaults:
  - scope:
      path: ""
    values:
      layout: default
      # og:locale. jekyll-seo-tag derives og:locale from page.locale /
      # site.locale / page.lang (NOT the site's custom `lang:` key), so set it
      # here. EN is the default; the more-specific `zh` scope below overrides it
      # for the /zh/ tree. ZH notes live outside /zh/ and carry `locale: zh_CN`
      # in their own front matter.
      locale: en_US
      # Social/share card. PNG (not SVG) so link previews render on
      # iMessage, Slack, X, LinkedIn, WhatsApp, Discord — none of which
      # rasterize SVG og:images. jekyll-seo-tag emits og:image plus
      # width/height/alt from this map.
      image:
        path: /assets/img/social-card.png
        width: 1200
        height: 630
        alt: "Frank Xue — software engineer. Building auditable tools for code, systems, and agents."
  # ZH page tree: override og:locale to zh_CN, and swap in the Chinese share
  # card so a shared /zh/ URL doesn't preview as an English site. More-specific
  # path scope wins over the global "" scope above. NOTE: this matches *source*
  # paths, so it does not reach the ZH notes (they live in _notes/*.zh.md and
  # only their permalink is under /zh/) — those carry `image:` in their own
  # front matter, next to the `locale:` they already declare for the same reason.
  - scope:
      path: "zh"
    values:
      locale: zh_CN
      image:
        path: /assets/img/social-card.zh.png
        width: 1200
        height: 630
        alt: "Frank Xue——软件工程师。为代码、系统和 Agent，写可审计、状态清晰的工具。"
  # Notes are long-form documents; the more-specific scope sets their layout
  # while inheriting the share image above.
  - scope:
      path: ""
      type: notes
    values:
      layout: note

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - docs/superpowers/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - assets/fonts/README.md   # dev-only provenance doc; the defaults `layout` would otherwise render it into the site
  - CLAUDE.md
  - scripts/
